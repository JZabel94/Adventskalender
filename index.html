<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventskalender</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="calendar-page">
  <header class="page-header">
    <div class="garland" aria-hidden="true"></div>
    <h1>Adventskalender</h1>
    <p class="subtitle">Öffne ein Türchen und entdecke, was dich erwartet.</p>
    <p class="progress" id="progress" aria-live="polite"></p>
  </header>

  <main>
    <div class="calendar" id="calendar" aria-label="Adventskalender mit 24 Türchen"></div>
  </main>

  <footer class="page-footer">
    <button type="button" id="reset" class="reset-button">Kalender zurücksetzen</button>
  </footer>

  <script src="content.js"></script>
  <script src="store.js"></script>
  <script src="script.js"></script>
</body>
</html>
